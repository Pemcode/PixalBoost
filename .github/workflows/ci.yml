name: ci

# Gate CPU. Doit rester sans GPU et sans reseau au-dela de l'installation des
# dependances -- c'est ce qui le garde sous les 60 s. Voir docs/testing.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --all-groups --locked

      - name: Gate (lint + typecheck + tests)
        run: uv run poe check
