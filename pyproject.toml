[project]
name = "pixaboost"
version = "0.1.0"
description = "Reconstruction 3D (GLB) haute fidelite d'une piece photographiee, via Pixal3D multi-vues."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "trimesh>=5.0.0",
]

[project.optional-dependencies]
gui = [
    "paramiko>=3.5,<5",
    "PyQt6>=6.6,<7",
]
# SAM 3 click segmentation (F14). Deliberately NOT in `dev`: it pulls ~3 GB of
# wheels and the gate must stay installable on free CI. Everything in
# `backends/sam3.py` imports it lazily. See ADR-0014.
segmentation = [
    "torch>=2.6",
    "transformers>=4.60",
]

[project.scripts]
pixaboost = "pixaboost.cli:main"
pixaboost-gui = "pixaboost.gui.__main__:main"

[dependency-groups]
dev = [
    "paramiko>=3.5,<5",
    "PyQt6>=6.6,<7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "poethepoet>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixaboost"]

# ---------------------------------------------------------------------------
# Task runner. Canonical surface: `uv run poe <task>`.
# `make <task>` delegates here on platforms that have GNU make (CI, RunPod).
# See DECISIONS.md ADR-0002.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
setup = { cmd = "uv sync --all-groups", help = "Install the CPU dev environment from scratch" }
lint = { cmd = "ruff check src tests", help = "Lint" }
fmt = { cmd = "ruff format src tests", help = "Format" }
typecheck = { cmd = "mypy src", help = "Static type check" }
test = { cmd = "pytest tests/unit tests/integration -q", help = "CPU tests (no GPU, no network)" }
check = { sequence = [
    "lint",
    "typecheck",
    "test",
], help = "Full CPU gate. Must be green before any commit.", ignore_fail = false }
bench-build = { cmd = "python -m pixaboost.bench.build", help = "Render the synthetic benchmark into data/bench" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: requires a CUDA GPU (never runs in CPU CI)",
    "network: requires network access (never runs in CPU CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["pixaboost"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trimesh.*", "open3d.*", "scipy.*", "lpips.*"]
ignore_missing_imports = true

# Optional heavyweight extras. They are imported lazily inside `backends/`, so
# the CPU gate type-checks without ever installing 3 GB of wheels.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
